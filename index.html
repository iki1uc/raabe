:root {
  --bg: #070605;
  --surface: #0e0c09;
  --surface-2: #15110b;
  --ink: #ece5d8;
  --muted: #9a8f7c;
  --line: #2a2317;
  --root: #c97b2d;
  --root-soft: #8a5320;
  --leaf: #4ade80;
  --leaf-dim: #1d3a28;
  --gold: #f5c542;
  --accent: #e08a3c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #070605;
    --surface: #0e0c09;
    --surface-2: #15110b;
    --ink: #ece5d8;
    --muted: #9a8f7c;
    --line: #2a2317;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
}
.font-display {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
.font-mono2 {
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@keyframes pulseGlow {
  0%, 100% {
    opacity: 0.55;
  }
  50% {
    opacity: 1;
  }
}
.leaf-alive {
  animation: pulseGlow 2.6s ease-in-out infinite;
}
@keyframes growIn {
  from {
    transform: scale(0.6);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
.leaf-in {
  animation: growIn 0.5s ease both;
}
::-moz-selection {
  background: #c97b2d;
  color: #0a0806;
}
::selection {
  background: #c97b2d;
  color: #0a0806;
}
.hover\:brightness-110:hover {
  --tw-brightness: brightness(1.1);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
.disabled\:opacity-50:disabled {
  opacity: 0.5;
}
@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }
  .sm\:items-center {
    align-items: center;
  }
  .sm\:p-3 {
    padding: 0.75rem;
  }
  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-\[1fr_340px\] {
    grid-template-columns: 1fr 340px;
  }
